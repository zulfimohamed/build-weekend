<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Window Seat</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="train">
<canvas id="view"></canvas>
<div id="frame"></div>
<div id="route">
  <select id="from" aria-label="origin"></select>
  <span id="route-arrow">&#8594;</span>
  <select id="to" aria-label="destination"></select>
</div>
<div id="controls">
  <button id="mode">&#9992;&#65039; take the plane</button>
  <button id="time">&#127749; time of day</button>
  <button id="scenery">&#127958;&#65039; scenery</button>
  <select id="aircraft" aria-label="aircraft type"></select>
  <button id="sound" aria-pressed="false">&#128263; sound</button>
</div>
<script src="script.js"></script>
</body>
</html>
