<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Approach Radar</title>
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="hall">
  <header class="board-header">
    <span class="hdr-title">APPROACH RADAR</span>
    <span class="hdr-mid" id="freq">KUL APP 119.6</span>
    <span class="hdr-clock" id="clock">--:--:--Z</span>
  </header>

  <div class="layout">
    <div class="scope-wrap">
      <canvas id="scope" aria-label="radar scope"></canvas>
    </div>
    <aside class="strips">
      <div class="strips-head">FLIGHT STRIPS</div>
      <div id="striplist"></div>
    </aside>
  </div>

  <footer class="controls">
    <select id="hub" aria-label="radar site"></select>
    <button id="range">RNG 40 NM</button>
    <button id="labels" aria-pressed="true">labels</button>
    <button id="trails" aria-pressed="true">trails</button>
    <button id="wx" aria-pressed="false">wx</button>
    <button id="sound" aria-pressed="false">&#128263; sound</button>
  </footer>
</main>
<script src="script.js"></script>
</body>
</html>
